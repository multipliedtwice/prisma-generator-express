---
layout: default
---

<div class="guide" data-guide-root>
  <div class="guide-mobilebar">
    <button
      type="button"
      class="guide-mobilebar__menu"
      aria-controls="guide-nav"
      aria-expanded="false"
      data-guide-nav-open
    >
      <svg class="guide-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M3 5.5h14M3 10h14M3 14.5h9" />
      </svg>
      <span class="guide-mobilebar__label">
        <small>Contents</small>
        <strong data-guide-current>Overview</strong>
      </span>
    </button>
    <button
      type="button"
      class="guide-mobilebar__search"
      aria-label="Search the reference"
      data-guide-search-open
    >
      <svg class="guide-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <circle cx="8.75" cy="8.75" r="5.25" />
        <path d="m12.75 12.75 4 4" />
      </svg>
    </button>
    <span class="guide-progress" aria-hidden="true"><span data-guide-progress></span></span>
  </div>

  <aside id="guide-nav" class="guide-nav" aria-label="Reference sections" data-guide-nav>
    <div class="guide-nav__head">
      <p>Contents</p>
      <button type="button" aria-label="Close contents" data-guide-nav-close>
        <svg class="guide-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="m5 5 10 10M15 5 5 15" />
        </svg>
      </button>
    </div>
    <nav aria-label="Sections" data-guide-nav-list></nav>
    <noscript><p class="guide-noscript">Contents and search need JavaScript. The full reference is on this page.</p></noscript>
  </aside>
  <div class="guide-scrim" data-guide-nav-scrim hidden></div>

  <article id="guide-top" class="guide-prose" data-guide-content>
    {{ content }}
  </article>

  <aside class="guide-rail" aria-labelledby="guide-rail-title">
    <p id="guide-rail-title" class="guide-rail__title" data-guide-rail-title>Overview</p>
    <ol class="guide-rail__list" data-guide-rail-list></ol>
    <div class="guide-rail__footer">
      <div class="guide-rail__meter" aria-hidden="true"><span data-guide-progress></span></div>
      <p><span data-guide-progress-label>0%</span> read, about <span data-guide-reading-time>—</span> min total</p>
      <p>Updated {{ site.updated_on | date: "%-d %b %Y" }}</p>
      <a href="#guide-top" data-guide-top>Back to top</a>
    </div>
  </aside>
</div>

<dialog class="guide-palette" aria-labelledby="guide-palette-label" data-guide-palette>
  <div class="guide-palette__field">
    <label id="guide-palette-label" for="guide-palette-input" class="visually-hidden">Search the reference</label>
    <svg class="guide-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <circle cx="8.75" cy="8.75" r="5.25" />
      <path d="m12.75 12.75 4 4" />
    </svg>
    <input
      id="guide-palette-input"
      type="text"
      role="combobox"
      aria-expanded="true"
      aria-controls="guide-palette-results"
      aria-autocomplete="list"
      aria-describedby="guide-palette-status"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="go"
      placeholder="Search options, operations, guard shapes…"
      data-guide-palette-input
    />
    <button type="button" class="guide-palette__close" data-guide-palette-close>Esc</button>
  </div>
  <p id="guide-palette-status" class="guide-palette__status" role="status" aria-live="polite" data-guide-palette-status></p>
  <ul id="guide-palette-results" class="guide-palette__results" role="listbox" aria-label="Search results" data-guide-palette-results></ul>
  <div class="guide-palette__keys" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>↵</kbd> open</span>
    <span><kbd>Esc</kbd> close</span>
  </div>
</dialog>

<p class="guide-toast" role="status" aria-live="polite" data-guide-toast></p>

<script type="application/json" data-guide-parts>{{ site.data.guide.parts | jsonify }}</script>
