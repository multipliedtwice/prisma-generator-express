version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: 'daily'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /article-labs/http
    schedule:
      interval: 'daily'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /article-labs/guard
    schedule:
      interval: 'daily'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
